name: esso
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  file_picker: ^12.0.0
  image_cropper: ^13.0.0
  camera: ^0.12.1
  crop_your_image: ^2.0.1
  path_provider: ^2.1.6
  pdfrx: ^2.10.1
  http: ^1.6.0
  http_parser: ^4.1.2
  archive: ^4.5.2
  open_filex: ^5.0.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  path: ^1.9.1
  custom_refresh_indicator: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
